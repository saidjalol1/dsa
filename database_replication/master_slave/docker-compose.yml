    haproxy:
        image: haproxy:latest
        container_name: haproxy_lb
        restart: 'unless-stopped'
        ports:
            - "5000:5000" 
            - "5001:5001" 
        volumes:
            - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
        command: ["haproxy", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
        depends_on:
            - master_db
            - slave_1
            - slave_2
            - slave_3
            - slave_4
            - slave_5
            
