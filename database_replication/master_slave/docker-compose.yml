
services:
    master_db:
        image: postgres
        container_name: master_db
        restart: 'unless-stopped'
        environment:
            POSTGRES_USER: ${MASTER_USER}
            POSTGRES_PASSWORD: ${MASTER_PASSWORD}
            POSTGRES_DB: ${MASTER_DB}
            POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
        ports:
            - '5432:5432'
        volumes:
            - master_data:/var/lib/postgresql

    slave_1:
        image: postgres
        container_name: slave_1
        user: postgres
        environment:
            POSTGRES_PASSWORD: ${MASTER_PASSWORD}
        ports:
            - "5433:5432"
        volumes:
            - slave_1_data:/var/lib/postgresql
        command: |
            bash -c "
            rm -rf /var/lib/postgresql/*
            until pg_isready -h master_db -p 5432 -U ${MASTER_USER}; do sleep 1; done
            sleep 2
            PGPASSWORD=${MASTER_PASSWORD} pg_basebackup -h master_db -D /var/lib/postgresql/18/docker -U ${MASTER_USER} -Fp -Xs -P -R
            exec postgres
            "
        depends_on:
            - master_db

