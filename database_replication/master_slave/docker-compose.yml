services:
    master_db:
        image: postgres:15
        container_name: master_db
        environment:
            POSTGRES_USER: ${MASTER_USER}
            POSTGRES_PASSWORD: ${MASTER_PASSWORD}
            POSTGRES_DB: ${MASTER_DB}
            POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
        ports:
            - '5432:5432'
        volumes:
            - master_data:/var/lib/postgresql/data

    slave_1:
        image: postgres:15
        container_name: slave_1
        environment:
            POSTGRES_PASSWORD: ${MASTER_PASSWORD}
        ports:
            - "5433:5432"
        volumes:
            - slave_1_data:/var/lib/postgresql/data
        command: |
            bash -c "
            rm -rf /var/lib/postgresql/data/*

            until pg_isready -h master_db -p 5432 -U ${MASTER_USER}; do 
                  echo 'Master ishga tushishi kutilmoqda...'
                  sleep 1
            done

            sleep 2

            PGPASSWORD=${MASTER_PASSWORD} pg_basebackup -h master_db -D /var/lib/postgresql/data -U ${MASTER_USER} -Fp -Xs -P -R

            # Windows permission xatosini chetlab o'tish uchun serverni --no-sync bilan yurgizamiz
            exec postgres
            "
        depends_on:
            - master_db

    slave_2:
