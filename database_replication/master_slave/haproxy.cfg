global
    log /dev/log local0

defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

frontend postgres_write_front
    bind *:5000
    default_backend postgres_write_back

backend postgres_write_back
    mode tcp
    balance roundrobin
    timeout connect 5s
    timeout server 50s
    server master_db master_db:5432 check

frontend postgres_read_front
    bind *:5001
    default_backend postgres_read_back

backend postgres_read_back
    mode tcp
    balance roundrobin
    timeout connect 5s
    timeout server 50s
    server slave_1 slave_1:5432 check
    server slave_2 slave_2:5432 check
    server slave_3 slave_3:5432 check
    server slave_4 slave_4:5432 check
    server slave_5 slave_5:5432 check

